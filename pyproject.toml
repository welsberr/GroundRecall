[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "groundrecall"
version = "0.1.0a1"
description = "Grounded knowledge substrate for llmwiki++ style workflows."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "GroundRecall contributors" }
]
dependencies = [
  "epistemap @ git+https://github.com/welsberr/Epistemap.git@v0.1.0a4",
  "cryptography>=40,<46",
  "pydantic>=2,<3",
  "jsonschema>=4,<5",
  "PyYAML>=6,<7",
]

[project.scripts]
groundrecall = "groundrecall.cli:main"
groundrecall-mcp = "groundrecall.mcp:main"
groundrecall-mcp-http = "groundrecall.mcp_http:main"
groundrecall-mcp-audit-verify = "groundrecall.mcp_audit_verify:main"
groundrecall-mcp-audit-manifest = "groundrecall.mcp_audit_manifest:main"
groundrecall-mcp-audit-export = "groundrecall.mcp_audit_export:main"
groundrecall-handoff-promotion-operator = "groundrecall.handoff_promotion_operator:main"
groundrecall-handoff-discover = "groundrecall.handoff_discovery:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
